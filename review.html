  },
  deleteActor(id){
    const dramaCount=this.actorDramas(id).length;
    const cpCount=this.actorCps(id).length;
    if((dramaCount||cpCount) && !confirm(`이 배우는 드라마 ${dramaCount}편, CP ${cpCount}개에 연결돼 있어요. 삭제해도 그 작품·CP 자체는 남고, 배우 연결만 사라져요. 계속할까요?`)) return;
    this.state.actors=this.state.actors.filter(a=>a.id!==id);
    this.state.dramas.forEach(d=>{ (d.cast||[]).forEach(c=>{ if(c.actorId===id) c.actorId=null; }); });
    this.state.cps.forEach(c=>{ if(c.gongActorId===id) c.gongActorId=null; if(c.suActorId===id) c.suActorId=null; });
    this.persistActors(); this.persistDramas(); this.persistCps();
    this.closeActorDetail();
    this.renderActorsTab();
  },
  openActorMerge(id){ this.state.mergeSourceActorId=id; this.renderActorMerge(); },
  closeActorMerge(){ const ov=document.getElementById('actorMergeOverlay'); if(ov) ov.remove(); },
  renderActorMerge(){
    const source=this.actorById(this.state.mergeSourceActorId);
    if(!source) return;
    const others=this.state.actors.filter(a=>a.id!==source.id).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    const overlay=document.createElement('div');
    overlay.className='overlay center';
    overlay.id='actorMergeOverlay';
    overlay.innerHTML=`
      <div class="modal">
        <div class="panel-hdr"><h2 class="serif">배우 합치기</h2><button class="iconbtn" onclick="App.closeActorMerge()">✕</button></div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:14px;">같은 배우가 이름 표기 차이 등으로 중복 등록됐을 때 사용해요. "${this.esc(source.name)}"의 출연작·CP 연결을 아래에서 고른 배우로 전부 옮기고, "${this.esc(source.name)}" 항목은 삭제돼요.</div>
        <div class="field">
          <label>합칠 대상 배우</label>
          <select id="mergeTargetSelect">
            <option value="">배우 선택</option>
            ${others.map(a=>`<option value="${a.id}">${this.esc(a.name)}</option>`).join('')}
          </select>
        </div>
        <div class="formfoot">
          <button class="btn btn-primary" style="flex:1" onclick="App.confirmActorMerge()">합치기</button>
          <button class="btn btn-ghost" onclick="App.closeActorMerge()">취소</button>
        </div>
      </div>`;
    document.getElementById('app').appendChild(overlay);
  },
  confirmActorMerge(){
    const targetId=document.getElementById('mergeTargetSelect').value;
    if(!targetId){ alert('합칠 배우를 선택해주세요.'); return; }
    const sourceId=this.state.mergeSourceActorId;
    if(!confirm('합치면 되돌릴 수 없어요. 계속할까요?')) return;
    this.state.dramas.forEach(d=>{ (d.cast||[]).forEach(c=>{ if(c.actorId===sourceId) c.actorId=targetId; }); });
    this.state.cps.forEach(c=>{
      if(c.gongActorId===sourceId) c.gongActorId=targetId;
      if(c.suActorId===sourceId) c.suActorId=targetId;
    });
    this.state.actors=this.state.actors.filter(a=>a.id!==sourceId);
    this.persistDramas(); this.persistCps(); this.persistActors();
    this.closeActorMerge();
    this.closeActorDetail();
    this.renderActorsTab();
  },

  openActorForm(existingId){
    this.state.editingActorId=existingId||null;
    const existing=existingId?this.actorById(existingId):null;
    this.state.actorDraft = existing ? JSON.parse(JSON.stringify(existing)) : {
      id:null,name:'',image:null,realName:'',altName:'',birthdate:'',nationality:'',studioId:null,
      realityList:[{title:'',year:'',memo:''}], discography:[{title:'',year:'',memo:''}], memo:''
    };
    this.renderActorForm();
  },
  closeActorForm(){
    this.state.actorDraft=null;
    const ov=document.getElementById('actorFormOverlay'); if(ov) ov.remove();
    if(this.state.reopenFormAfterActorCreate){
      this.state.reopenFormAfterActorCreate=false;
      this.switchTab('review');
      this.renderForm();
    }
    if(this.state.reopenCpFullFormAfterActorCreate){
      this.state.reopenCpFullFormAfterActorCreate=false;
      this.switchTab('cps');
      this.renderCpFullForm();
    }
  },
  closeActorFormKeepDraft(){
    const ov=document.getElementById('actorFormOverlay');
    if(ov) ov.remove();
    this.state.reopenActorFormAfterManager=true;
  },
  renderActorForm(){
    const d=this.state.actorDraft;
    const overlay=document.createElement('div');
    overlay.className='overlay';
    overlay.id='actorFormOverlay';
    overlay.innerHTML=`
      <div class="panel">
        <div class="panel-hdr">
          <h2 class="serif">${this.state.editingActorId?'배우 수정':'배우 등록'}</h2>
          <button class="iconbtn" onclick="App.closeActorForm()">✕</button>
        </div>
        <div class="field">
          <label>사진 (선택)</label>
          <div class="poster-upload portrait" id="actorPosterUpload">
            ${d.image?`<img src="${d.image}" class="poster-preview" onclick="event.stopPropagation();App.openImageLightbox('${d.image}')">`:`<div class="poster-placeholder">🎭</div>`}
          </div>
          <div class="poster-actions">
            <label class="btn" style="cursor:pointer;">이미지 선택<input type="file" accept="image/*" style="display:none;" onchange="App.handleActorImageUpload(event)"></label>
            ${d.image?`<button type="button" class="btn btn-ghost" onclick="App.clearActorImage()">제거</button>`:''}
          </div>
          <div class="poster-url-row">
            <input type="text" id="actorImageUrlInput" placeholder="또는 이미지 URL 붙여넣기" value="${(d.image && !d.image.startsWith('data:'))?this.esc(d.image):''}" onkeydown="if(event.key==='Enter'){event.preventDefault();App.applyActorImageUrl();}">
            <button type="button" class="btn" onclick="App.applyActorImageUrl()">적용</button>
          </div>
        </div>
        <div class="field"><label>이름 (표시명)</label><input type="text" value="${this.esc(d.name)}" oninput="App.state.actorDraft.name=this.value" placeholder="예: 오프 준티피"></div>
        <div class="row2">
          <div class="field"><label>본명</label><input type="text" value="${this.esc(d.realName)}" oninput="App.state.actorDraft.realName=this.value"></div>
          <div class="field"><label>츠렌</label><input type="text" value="${this.esc(d.altName)}" oninput="App.state.actorDraft.altName=this.value"></div>
        </div>
        <div class="row2">
          <div class="field"><label>생년월일</label><input type="text" value="${this.esc(d.birthdate)}" oninput="App.state.actorDraft.birthdate=this.value" placeholder="예: 1993-03-17"></div>
          <div class="field"><label>국적</label><input type="text" value="${this.esc(d.nationality)}" oninput="App.state.actorDraft.nationality=this.value" placeholder="예: 태국"></div>
        </div>
        <div class="field">
          <label style="display:flex;justify-content:space-between;align-items:center;">소속사 <button type="button" class="addrow" style="padding:2px 8px;font-size:11px;margin:0;" onclick="App.closeActorFormKeepDraft(); App.openManager('studio');">+ 관리</button></label>
          <select onchange="App.state.actorDraft.studioId=this.value||null;">
            <option value="">선택 안 함</option>
            ${this.state.studios.map(s=>`<option value="${s.id}" ${d.studioId===s.id?'selected':''}>${this.esc(s.label)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>기타 (메모)</label><textarea oninput="App.state.actorDraft.memo=this.value">${this.esc(d.memo)}</textarea></div>
        <div class="formfoot">
          <button class="btn btn-primary" style="flex:1" onclick="App.saveActor()">${this.state.editingActorId?'수정 완료':'배우 등록'}</button>
          <button class="btn btn-ghost" onclick="App.closeActorForm()">취소</button>
        </div>
      </div>`;
    document.getElementById('app').appendChild(overlay);
  },
  entryEditRowsHTML(draftKey,field){
    const d=this.state[draftKey];
    return d[field].map((r,i)=>`
      <div class="dyn-row">
        <input type="text" placeholder="제목" value="${this.esc(r.title)}" oninput="App.state.${draftKey}.${field}[${i}].title=this.value">
        <input type="text" placeholder="연도" value="${this.esc(r.year)}" oninput="App.state.${draftKey}.${field}[${i}].year=this.value" style="max-width:80px;">
        <button class="rowbtn" onclick="App.removeEntryRow('${draftKey}','${field}',${i})">✕</button>
      </div>
      <input type="text" class="cast-memo" placeholder="메모 (선택)" value="${this.esc(r.memo)}" oninput="App.state.${draftKey}.${field}[${i}].memo=this.value" style="margin-bottom:8px;">
    `).join('');
  },
  entryRowsBoxId(draftKey,field){
    if(draftKey==='actorDraft') return field==='realityList'?'actorRealityRows':'actorDiscographyRows';
    return field==='realityList'?'cpFullRealityRows':'cpFullDiscographyRows';
  },
  addActorRow(field){
    this.state.actorDraft[field].push({title:'',year:'',memo:''});
    const box=document.getElementById(this.entryRowsBoxId('actorDraft',field));
    if(box) box.innerHTML=this.entryEditRowsHTML('actorDraft',field);
  },
  removeEntryRow(draftKey,field,i){
    this.state[draftKey][field].splice(i,1);
    if(this.state[draftKey][field].length===0) this.state[draftKey][field].push({title:'',year:'',memo:''});
    const box=document.getElementById(this.entryRowsBoxId(draftKey,field));
    if(box) box.innerHTML=this.entryEditRowsHTML(draftKey,field);
  },
  handleActorImageUpload(e){
    const file=e.target.files[0];
    if(!file) return;
    this.compressImageFile(file,500,0.75).then(url=>{
      this.state.actorDraft.image=url;
      const ov=document.getElementById('actorFormOverlay'); if(ov) ov.remove();
      this.renderActorForm();
    }).catch(()=>alert('이미지를 불러오지 못했어요.'));
  },
  clearActorImage(){
    this.state.actorDraft.image=null;
    const ov=document.getElementById('actorFormOverlay'); if(ov) ov.remove();
    this.renderActorForm();
  },
  applyActorImageUrl(){
    const input=document.getElementById('actorImageUrlInput');
    const url=input.value.trim();
    if(!url) return;
    this.state.actorDraft.image=url;
    const ov=document.getElementById('actorFormOverlay'); if(ov) ov.remove();
    this.renderActorForm();
  },
  saveActor(){
    const d=this.state.actorDraft;
    if(!d.name || !d.name.trim()){ alert('이름을 입력해주세요.'); return; }
    d.realityList=d.realityList.filter(r=>r.title||r.year||r.memo);
    d.discography=d.discography.filter(r=>r.title||r.year||r.memo);
    if(this.state.editingActorId){
      const idx=this.state.actors.findIndex(a=>a.id===this.state.editingActorId);
      d.id=this.state.editingActorId;
      this.state.actors[idx]=d;
    }else{
      const dup=this.state.actors.find(a=>a.name===d.name.trim());
      if(dup){ alert('이미 같은 이름의 배우가 등록되어 있어요. 그 배우를 수정해주세요.'); return; }
      d.id=this.uid();
      this.state.actors.push(d);
    }
    this.persistActors();
    this.state.actorDraft=null;
    const ov=document.getElementById('actorFormOverlay'); if(ov) ov.remove();
    if(this.state.reopenFormAfterActorCreate){
      this.state.reopenFormAfterActorCreate=false;
      this.switchTab('review');
      this.renderForm();
      return;
    }
    if(this.state.reopenCpFullFormAfterActorCreate){
      this.state.reopenCpFullFormAfterActorCreate=false;
      this.switchTab('cps');
      this.renderCpFullForm();
      return;
    }
    this.renderActorsTab();
  },

  /* ================= CP 탭 ================= */
  renderCpsTab(){
    const s=this.state;
    const app=document.getElementById('app');
    app.innerHTML=`
      <div class="hdr">
        <div>
          <h1 class="serif">입덕티켓</h1>
          <div class="tag">등록한 CP들 — 총 ${s.cps.length}개</div>
        </div>
        <div class="hdr-actions">
          <button class="btn btn-primary" onclick="App.openCpFullForm()">+ CP 등록</button>
          <div class="gear-wrap" id="gearWrap">
            <button class="btn gear-btn" onclick="App.toggleGearMenu(event)" aria-label="설정">⚙</button>
            <div class="gear-menu" id="gearMenu">
              <div class="gear-menu-label">보기 방식</div>
              <button class="gear-view-opt ${s.cpViewMode!=='table'?'active':''}" data-mode="card" onclick="App.setCpViewMode('card')">카드형<span class="chk">✓</span></button>
              <button class="gear-view-opt ${s.cpViewMode==='table'?'active':''}" data-mode="table" onclick="App.setCpViewMode('table')">표형식<span class="chk">✓</span></button>
              <div class="gear-menu-divider"></div>
              <button onclick="App.closeGearMenu(); App.openManager('studio');">제작사 관리</button>
            </div>
          </div>
        </div>
      </div>
      ${this.tabBarHTML()}
      <div class="grid" id="cpGrid"></div>
    `;
    this.updateCpGrid();
  },
  setCpViewMode(mode){
    this.state.cpViewMode=mode;
    this.storageSet('cpViewMode', mode);
    document.querySelectorAll('#gearMenu .gear-view-opt').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.mode===mode);
    });
    this.closeGearMenu();
    this.updateCpGrid();
  },
  updateCpGrid(){
    const grid=document.getElementById('cpGrid');
    if(!grid) return;
    const list=this.state.cps;
    if(list.length===0){
      grid.outerHTML=`<div class="empty" id="cpGrid"><div class="big">💞</div>아직 등록된 CP가 없어요.</div>`;
      return;
    }
    if(this.state.cpViewMode==='table'){
      grid.className='table-wrap';
      grid.innerHTML=this.cpTableViewHTML(list);
    }else{
      grid.className='grid';
      const active=list.filter(c=>!c.wrecked);
      const wrecked=list.filter(c=>c.wrecked);
      let html=active.map(c=>this.cpCardHTML(c)).join('');
      if(wrecked.length){
        html += `<div class="cp-wrecked-divider">⚓💔 난파된 CP</div>` + wrecked.map(c=>this.cpCardHTML(c)).join('');
      }
      grid.innerHTML=html;
    }
  },
  cpTableViewHTML(list){
    const sorted=[...list].sort((a,b)=>(a.wrecked?1:0)-(b.wrecked?1:0));
    const rows=sorted.map(c=>{
      const gong=this.actorById(c.gongActorId), su=this.actorById(c.suActorId);
      const dramaCount=this.state.dramas.filter(d=>(d.cpIds||[]).includes(c.id)).length;
      const studio=this.studioById(c.studioId);
      return `<tr onclick="App.openCpProfile('${c.id}')" style="${c.wrecked?'opacity:.55;':''}">
        <td>${c.highlight?this.esc(c.highlight)+' ':''}${this.esc(this.cpLabel(c))}${c.wrecked?' ⚓💔':''}</td>
        <td>${gong?this.esc(gong.name):'-'} x ${su?this.esc(su.name):'-'}</td>
        <td>${this.esc(c.activePeriod)||'-'}</td>
        <td>${studio?this.esc(studio.label):'-'}</td>
        <td>${dramaCount}</td>
      </tr>`;
    }).join('');
    return `<table class="data-table"><thead><tr><th>CP명</th><th>멤버</th><th>활동기간</th><th>소속사</th><th>드라마</th></tr></thead><tbody>${rows}</tbody></table>`;
  },
  cpCardHTML(c){
    const dramaCount=this.state.dramas.filter(d=>(d.cpIds||[]).includes(c.id)).length;
    return `
      <div class="person-card ${c.wrecked?'person-card-wrecked':''}" onclick="App.openCpProfile('${c.id}')">
        <div class="person-card-imgwrap">
          ${c.image?`<img src="${c.image}">`:`<div class="person-card-placeholder">${c.highlight||'💞'}</div>`}
        </div>
        <div class="person-card-body">
          <div class="person-card-name serif">${c.highlight?this.esc(c.highlight)+' ':''}${this.esc(this.cpLabel(c))}${c.wrecked?' ⚓💔':''}</div>
          <div class="person-card-meta">출연작 ${dramaCount}편${c.wrecked?' · 난파':''}</div>
        </div>
      </div>`;
  },
  openCpProfile(id){ this.state.viewingCpId=id; this.renderCpProfile(); },
  closeCpProfile(){ const ov=document.getElementById('cpProfileOverlay'); if(ov) ov.remove(); },
  renderCpProfile(){
    const c=this.state.cps.find(x=>x.id===this.state.viewingCpId);

    const gong=this.actorById(c.gongActorId);
    const su=this.actorById(c.suActorId);

      <div class="modal">

        <div class="profile-hero">
          <div class="profile-hero-imgwrap">${c.image?`<img src="${c.image}" onclick="App.openImageLightbox('${c.image}')">`:`<div class="d-emoji">${c.highlight||'💞'}</div>`}</div>
          <div class="profile-hero-body">

              ${c.activePeriod?`<span class="badge">${this.esc(c.activePeriod)}</span>`:''}

            </div>
          </div>
        </div>
        <div class="sec-title">멤버</div>

        <div class="cast-card"><div class="cast-field"><span class="cast-field-label">수</span><span class="cast-field-value actor-name" ${su?`style="cursor:pointer;" onclick="App.closeCpProfile(); App.openActorDetail('${su.id}')"`:''}>${su?this.esc(su.name):'-'}</span></div></div>
        ${dramas.length?`<div class="sec-title">드라마</div><div class="kwpills">${dramas.map(d=>`<span class="kwpill" style="cursor:pointer;" onclick="App.closeCpProfile(); App.openDetail('${d.id}')">${this.esc(d.title)}</span>`).join('')}</div>`:''}
        ${c.memo?`<div class="sec-title">기타</div><div class="spoiler-box">${this.esc(c.memo)}</div>`:''}
        <div class="formfoot" style="justify-content:flex-end;">
          <button class="btn" onclick="App.closeCpProfile(); App.openCpFullForm('${c.id}');">수정</button>
          <button class="btn btn-danger" onclick="App.deleteCpFromTab('${c.id}')">삭제</button>
        </div>
      </div>`;
    document.getElementById('app').appendChild(overlay);
  },
  deleteCpFromTab(id){
    const count=this.state.dramas.filter(d=>(d.cpIds||[]).includes(id)).length;
    if(count>0 && !confirm(`${count}편의 드라마에 연결되어 있어요. 삭제하면 그 작품들에서도 이 CP 표시가 사라져요. 계속할까요?`)) return;
    this.state.cps=this.state.cps.filter(c=>c.id!==id);
    this.state.dramas.forEach(d=>{ d.cpIds=(d.cpIds||[]).filter(cid=>cid!==id); });
    this.persistCps(); this.persistDramas();
    this.closeCpProfile();
    this.renderCpsTab();
  },
  openCpFullForm(existingId){
    this.state.editingCpFullId=existingId||null;
    const existing=existingId?this.state.cps.find(c=>c.id===existingId):null;
    this.state.cpFullDraft = existing ? JSON.parse(JSON.stringify(existing)) : {
      id:null,gongActorId:null,suActorId:null,nickname:'',highlight:'',image:null,
      activePeriod:'',wrecked:false,studioId:null,
      realityList:[{title:'',year:'',memo:''}], discography:[{title:'',year:'',memo:''}], memo:''
    };
    this.renderCpFullForm();
  },

    if(role==='gong') this.state.cpFullDraft.gongActorId = (this.state.cpFullDraft.gongActorId===actorId) ? null : actorId;
    else this.state.cpFullDraft.suActorId = (this.state.cpFullDraft.suActorId===actorId) ? null : actorId;
    this.refreshCpActorSearchList();
    const gongActor=this.actorById(this.state.cpFullDraft.gongActorId);
    const suActor=this.actorById(this.state.cpFullDraft.suActorId);
    const gd=document.getElementById('cpFullGongDisplay');
    if(gd) gd.innerHTML = gongActor?this.esc(gongActor.name):'<span style="color:var(--muted);font-weight:400;">공 배우 선택 안 함</span>';
    const sd=document.getElementById('cpFullSuDisplay');
    if(sd) sd.innerHTML = suActor?this.esc(suActor.name):'<span style="color:var(--muted);font-weight:400;">수 배우 선택 안 함</span>';

    const hidden=document.getElementById('cpFullHighlight');

    document.querySelectorAll('#cpFullHighlightPicker .cp-highlight-btn').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.emoji===hidden.value);
    });
  },

        </div>
        <div class="field"><label>CP명 (별명)</label><input type="text" id="cpFullNickname" value="${this.esc(d.nickname)}" placeholder="예: 오미확"></div>
        <div class="field">

  addCpFullRow(field){
    this.state.cpFullDraft[field].push({title:'',year:'',memo:''});
    const box=document.getElementById(this.entryRowsBoxId('cpFullDraft',field));
    if(box) box.innerHTML=this.entryEditRowsHTML('cpFullDraft',field);
  },
  handleCpFullImageUpload(e){
    const file=e.target.files[0];
    if(!file) return;
    this.compressImageFile(file,500,0.75).then(url=>{
      this.state.cpFullDraft.image=url;
      const ov=document.getElementById('cpFullFormOverlay'); if(ov) ov.remove();
      this.renderCpFullForm();
    }).catch(()=>alert('이미지를 불러오지 못했어요.'));
  },
  clearCpFullImage(){
    this.state.cpFullDraft.image=null;
    const ov=document.getElementById('cpFullFormOverlay'); if(ov) ov.remove();
    this.renderCpFullForm();
  },
  applyCpFullImageUrl(){
    const input=document.getElementById('cpFullImageUrlInput');
    const url=input.value.trim();
    if(!url) return;
    this.state.cpFullDraft.image=url;
    const ov=document.getElementById('cpFullFormOverlay'); if(ov) ov.remove();
    this.renderCpFullForm();
  },
  saveCpFullForm(){
    const d=this.state.cpFullDraft;
    d.nickname=document.getElementById('cpFullNickname').value.trim();
    const hlEl=document.getElementById('cpFullHighlight');
    d.highlight = hlEl?hlEl.value:'';
    d.realityList=d.realityList.filter(r=>r.title||r.year||r.memo);
    d.discography=d.discography.filter(r=>r.title||r.year||r.memo);
    this.persistActors();
    if(this.state.editingCpFullId){
      const idx=this.state.cps.findIndex(c=>c.id===this.state.editingCpFullId);
      d.id=this.state.editingCpFullId;
      this.state.cps[idx]=d;
    }else{
      d.id=this.uid();
      this.state.cps.push(d);
    }
    this.persistCps();
    this.state.cpFullDraft=null;
    const ov=document.getElementById('cpFullFormOverlay'); if(ov) ov.remove();
    if(this.state.reopenFormAfterManager){
      this.state.reopenFormAfterManager=false;
      this.renderForm();
      return;
    }
    this.renderCpsTab();
  },

  /* ================= OST 탭 ================= */
  filteredOsts(){
    const q=(this.state.ostSearch||'').toLowerCase().replace(/\s+/g,'');
    return this.state.osts.filter(o=> !q || (o.title+o.artist).toLowerCase().replace(/\s+/g,'').includes(q))
      .sort((a,b)=>a.title.localeCompare(b.title,'ko'));
  },
  ostDramas(ostId){
    return this.state.dramas.filter(d=>(d.ostIds||[]).includes(ostId));
  },
  renderOstsTab(){
    const s=this.state;
    const app=document.getElementById('app');
    app.innerHTML=`
      <div class="hdr">
        <div>
          <h1 class="serif">입덕티켓</h1>
          <div class="tag">등록한 OST — 총 ${s.osts.length}곡</div>
        </div>
        <div class="hdr-actions">
          <button class="btn btn-primary" onclick="App.openOstForm()">+ OST 등록</button>
          <div class="gear-wrap" id="gearWrap">

            <div class="gear-menu" id="gearMenu">
              <div class="gear-menu-label">보기 방식</div>
              <button class="gear-view-opt ${s.ostViewMode!=='table'?'active':''}" data-mode="card" onclick="App.setOstViewMode('card')">카드형<span class="chk">✓</span></button>
              <button class="gear-view-opt ${s.ostViewMode==='table'?'active':''}" data-mode="table" onclick="App.setOstViewMode('table')">표형식<span class="chk">✓</span></button>
              <div class="gear-menu-divider"></div>

            </div>
          </div>
        </div>
      </div>
      ${this.tabBarHTML()}
      <div class="toolbar">
        <input type="text" id="ostSearchInput" placeholder="곡명/아티스트로 검색" oninput="App.state.ostSearch=this.value; App.updateOstGrid();">
      </div>
      <div class="grid" id="ostGrid"></div>
    `;
    this.updateOstGrid();
  },
  setOstViewMode(mode){
    this.state.ostViewMode=mode;
    this.storageSet('ostViewMode', mode);
    document.querySelectorAll('#gearMenu .gear-view-opt').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.mode===mode);
    });
    this.closeGearMenu();
    this.updateOstGrid();
  },
  updateOstGrid(){
    const grid=document.getElementById('ostGrid');
    if(!grid) return;
    const list=this.filteredOsts();
    if(list.length===0){
      grid.outerHTML=`<div class="empty" id="ostGrid"><div class="big">🎵</div>아직 등록된 OST가 없어요.</div>`;
      return;
    }
    if(this.state.ostViewMode==='table'){
      grid.className='table-wrap';
      grid.innerHTML=this.ostTableViewHTML(list);
    }else{
      grid.className='grid';
      grid.innerHTML=list.map(o=>this.ostCardHTML(o)).join('');
    }
  },
  ostTableViewHTML(list){
    const rows=list.map(o=>{
      const genres=(o.genreIds||[]).map(id=>this.state.ostGenres.find(g=>g.id===id)).filter(Boolean).map(g=>g.label).join(', ');
      const dramas=this.ostDramas(o.id).map(d=>d.title).join(', ');
      return `<tr onclick="App.openOstDetail('${o.id}')">
        <td>${this.esc(o.title)}</td>
        <td>${this.esc(o.artist)||'-'}</td>
        <td class="wrap">${this.esc(genres)||'-'}</td>
        <td class="wrap">${this.esc(dramas)||'-'}</td>
        <td>${o.mvLink?'🎬':'-'}</td>
      </tr>`;
    }).join('');
    return `<table class="data-table"><thead><tr><th>곡명</th><th>아티스트</th><th>장르</th><th>작품</th><th>MV</th></tr></thead><tbody>${rows}</tbody></table>`;
  },
  ostCardHTML(o){
    const dramaCount=this.ostDramas(o.id).length;
    const genres=(o.genreIds||[]).map(id=>this.state.ostGenres.find(g=>g.id===id)).filter(Boolean);
    return `
      <div class="simple-card" onclick="App.openOstDetail('${o.id}')">
        <div class="ticket-title serif">${this.esc(o.title)}</div>
        ${o.artist?`<div class="ticket-orig">${this.esc(o.artist)}</div>`:''}
        ${genres.length?`<div class="ship-tags">${genres.map(g=>`<span class="ship-tag">${this.esc(g.label)}</span>`).join('')}</div>`:''}
        <div class="ticket-meta">${dramaCount}편에 사용됨${o.mvLink?' · 🎬 MV':''}</div>
      </div>`;
  },
  openOstDetail(id){ this.state.viewingOstId=id; this.renderOstDetail(); },
  closeOstDetail(){ const ov=document.getElementById('ostDetailOverlay'); if(ov) ov.remove(); },
  renderOstDetail(){
    const o=this.ostById(this.state.viewingOstId);
    if(!o) return;
    const dramas=this.ostDramas(o.id);
    const genres=(o.genreIds||[]).map(id=>this.state.ostGenres.find(g=>g.id===id)).filter(Boolean);
    const overlay=document.createElement('div');
    overlay.className='overlay center';
    overlay.id='ostDetailOverlay';
    overlay.innerHTML=`
      <div class="modal">
        <div class="panel-hdr"><div></div><button class="iconbtn" onclick="App.closeOstDetail()">✕</button></div>
        <div class="d-title serif">${this.esc(o.title)}</div>
        ${o.artist?`<div class="d-orig">${this.esc(o.artist)}</div>`:''}
        ${genres.length?`<div class="d-badges">${genres.map(g=>`<span class="badge">${this.esc(g.label)}</span>`).join('')}</div>`:''}
        ${dramas.length?`<div class="sec-title">사용된 드라마</div><div class="kwpills">${dramas.map(d=>`<span class="kwpill" style="cursor:pointer;" onclick="App.closeOstDetail(); App.openDetail('${d.id}')">${this.esc(d.title)}</span>`).join('')}</div>`:''}
        ${o.mvLink?`<div class="sec-title">MV</div><a href="${this.esc(o.mvLink)}" target="_blank" rel="noopener" class="btn" style="display:inline-block;text-decoration:none;">🎬 MV 보러가기</a>`:''}
        ${o.memo?`<div class="sec-title">기타</div><div class="spoiler-box">${this.esc(o.memo)}</div>`:''}
        <div class="formfoot" style="justify-content:flex-end;">
          <button class="btn" onclick="App.closeOstDetail(); App.openOstForm('${o.id}');">수정</button>
          <button class="btn btn-danger" onclick="App.deleteOst('${o.id}')">삭제</button>
        </div>
      </div>`;
    document.getElementById('app').appendChild(overlay);
  },
  deleteOst(id){
    const count=this.ostDramas(id).length;
    if(count>0 && !confirm(`${count}편의 드라마에 연결되어 있어요. 삭제하면 그 작품들에서도 이 OST가 사라져요. 계속할까요?`)) return;
    this.state.osts=this.state.osts.filter(o=>o.id!==id);
    this.state.dramas.forEach(d=>{ d.ostIds=(d.ostIds||[]).filter(oid=>oid!==id); });
    this.persistOsts(); this.persistDramas();
    this.closeOstDetail();
    this.renderOstsTab();
  },
  openOstForm(existingId){
    this.state.editingOstId=existingId||null;
    this.state.ostDramaSearchQuery='';
    const existing=existingId?this.ostById(existingId):null;
    const existingDrama = existingId ? this.ostDramas(existingId)[0] : null;
    this.state.ostDraft = existing ? {...JSON.parse(JSON.stringify(existing)), dramaId:existingDrama?existingDrama.id:null} : {id:null,title:'',artist:'',genreIds:[],dramaId:null,mvLink:'',memo:''};
    this.renderOstForm();
  },
  closeOstForm(){
    this.state.ostDraft=null;
    const ov=document.getElementById('ostFormOverlay'); if(ov) ov.remove();
    if(this.state.reopenFormAfterOstCreate){
      this.state.reopenFormAfterOstCreate=false;
      this.switchTab('review');
      this.renderForm();
    }
  },
  renderOstForm(){
    const d=this.state.ostDraft;
    const overlay=document.createElement('div');
    overlay.className='overlay';
    overlay.id='ostFormOverlay';
    overlay.innerHTML=`
      <div class="panel">
        <div class="panel-hdr">
          <h2 class="serif">${this.state.editingOstId?'OST 수정':'OST 등록'}</h2>
          <button class="iconbtn" onclick="App.closeOstForm()">✕</button>
        </div>
        <div class="field"><label>곡명</label><input type="text" value="${this.esc(d.title)}" oninput="App.state.ostDraft.title=this.value" placeholder="예: Loved You Anyway"></div>

        <div class="subhdr">작품</div>

        <div class="field"><label>MV 링크 (선택)</label><input type="text" value="${this.esc(d.mvLink)}" oninput="App.state.ostDraft.mvLink=this.value" placeholder="https://youtube.com/..."></div>

        <div class="field" style="margin-top:16px;"><label>기타 (메모)</label><textarea oninput="App.state.ostDraft.memo=this.value">${this.esc(d.memo)}</textarea></div>
        <div class="formfoot">
          <button class="btn btn-primary" style="flex:1" onclick="App.saveOst()">${this.state.editingOstId?'수정 완료':'OST 등록'}</button>
          <button class="btn btn-ghost" onclick="App.closeOstForm()">취소</button>
        </div>
      </div>`;
    document.getElementById('app').appendChild(overlay);
  },
  ostGenrePickerHTML(selectedIds){
    selectedIds=selectedIds||[];
    return this.state.ostGenres.map(g=>`
      <label><input type="checkbox" ${selectedIds.includes(g.id)?'checked':''} onchange="App.toggleOstGenre('${g.id}')">${this.esc(g.label)}</label>
    `).join('') || '<span style="color:var(--muted);font-size:12px;">등록된 장르가 없어요. "+ 장르 관리"에서 추가해보세요.</span>';
  },
  toggleOstGenre(id){
    const arr=this.state.ostDraft.genreIds;
    const idx=arr.indexOf(id);
    if(idx>-1) arr.splice(idx,1); else arr.push(id);
    const box=document.getElementById('ostGenrePick');
    if(box) box.innerHTML=this.ostGenrePickerHTML(arr);
  },
  closeOstFormKeepDraft(){
    const ov=document.getElementById('ostFormOverlay');
    if(ov) ov.remove();
    this.state.reopenOstFormAfterManager=true;
  },
  ostSelectedDramaLabel(dramaId){
    const dr=dramaId ? this.state.dramas.find(x=>x.id===dramaId) : null;
    return dr ? this.esc(dr.title) : '<span style="color:var(--muted);font-weight:400;">선택 안 함</span>';
  },
  openOstDramaSearch(){
    this.state.ostDramaSearchQuery='';
    this.renderOstDramaSearch();
  },
  closeOstDramaSearch(){ const ov=document.getElementById('ostDramaSearchOverlay'); if(ov) ov.remove(); },
  ostDramaSearchListHTML(){
    const q=(this.state.ostDramaSearchQuery||'').toLowerCase().replace(/\s+/g,'');
    const list=this.state.dramas.filter(dr=>!q || dr.title.toLowerCase().replace(/\s+/g,'').includes(q)).sort((a,b)=>a.title.localeCompare(b.title,'ko'));
    if(!list.length) return `<div style="color:var(--muted);font-size:13px;padding:16px 0;text-align:center;">일치하는 작품이 없어요.</div>`;
    const selectedId=this.state.ostDraft.dramaId;
    return list.map(dr=>`
      <div class="cast-picker-row ${selectedId===dr.id?'picked':''}" onclick="App.pickOstDrama('${dr.id}')">
        ${dr.poster?`<img src="${dr.poster}" class="table-thumb">`:this.countryEmoji(dr.country)}
        <span>${this.esc(dr.title)}</span>
        ${selectedId===dr.id?'<span class="chk">✓</span>':''}
      </div>`).join('');
  },
  refreshOstDramaSearchList(){
    const box=document.getElementById('ostDramaSearchList');
    if(box) box.innerHTML=this.ostDramaSearchListHTML();
  },
  renderOstDramaSearch(){
    const overlay=document.createElement('div');
    overlay.className='overlay center';
    overlay.id='ostDramaSearchOverlay';
    overlay.innerHTML=`
      <div class="modal">
        <div class="panel-hdr">
          <h2 class="serif">작품 검색</h2>
          <button class="iconbtn" onclick="App.closeOstDramaSearch()">✕</button>
        </div>
        <input type="text" placeholder="작품 제목 검색" value="${this.esc(this.state.ostDramaSearchQuery)}" oninput="App.state.ostDramaSearchQuery=this.value; App.refreshOstDramaSearchList();" style="width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;font-size:15px;margin-bottom:12px;">
        <div id="ostDramaSearchList" style="max-height:320px;overflow-y:auto;">${this.ostDramaSearchListHTML()}</div>
        <div class="formfoot">
          ${this.state.ostDraft.dramaId?`<button class="btn btn-ghost" style="flex:1" onclick="App.pickOstDrama(null)">선택 해제</button>`:''}
          <button class="btn btn-primary" style="flex:1" onclick="App.closeOstDramaSearch()">완료</button>
        </div>
      </div>`;
    document.getElementById('app').appendChild(overlay);
  },
  pickOstDrama(dramaId){
    this.state.ostDraft.dramaId = (dramaId===null || this.state.ostDraft.dramaId===dramaId) ? null : dramaId;
    this.refreshOstDramaSearchList();
    const foot=document.querySelector('#ostDramaSearchOverlay .formfoot');
    if(foot) foot.innerHTML = `${this.state.ostDraft.dramaId?`<button class="btn btn-ghost" style="flex:1" onclick="App.pickOstDrama(null)">선택 해제</button>`:''}<button class="btn btn-primary" style="flex:1" onclick="App.closeOstDramaSearch()">완료</button>`;
    const label=document.getElementById('ostDramaSelected');
    if(label) label.innerHTML=this.ostSelectedDramaLabel(this.state.ostDraft.dramaId);
  },
  saveOst(){
    const d=this.state.ostDraft;
    if((!d.title || !d.title.trim()) && (!d.artist || !d.artist.trim())){ alert('곡명이나 아티스트 중 하나는 입력해주세요.'); return; }
    const chosenDramaId = d.dramaId || null;
    delete d.dramaId;
    if(this.state.editingOstId){
      const idx=this.state.osts.findIndex(o=>o.id===this.state.editingOstId);
      d.id=this.state.editingOstId;
      this.state.osts[idx]=d;
    }else{
      d.id=this.uid();
      this.state.osts.push(d);
    }
    this.state.dramas.forEach(dr=>{
      const has=(dr.ostIds||[]).includes(d.id);
      const shouldHave = dr.id===chosenDramaId;
      if(shouldHave && !has){ dr.ostIds=[...(dr.ostIds||[]), d.id]; }
      else if(!shouldHave && has){ dr.ostIds=(dr.ostIds||[]).filter(id=>id!==d.id); }
    });
    this.persistOsts();
    this.persistDramas();
    this.state.ostDraft=null;
    const ov=document.getElementById('ostFormOverlay'); if(ov) ov.remove();
    if(this.state.reopenFormAfterOstCreate){
      this.state.reopenFormAfterOstCreate=false;
      this.switchTab('review');
      this.renderForm();
      return;
    }
    this.renderOstsTab();
  }
};

document.addEventListener('click', ()=>{ App.closeGearMenu(); });
App.init();
</script>
</body>
</html>
